# Builds and tests font-crusher on every push and pull request.
#
# The simplest caller of the shared workflow: crush is a host tool, so there is no cross
# toolchain, no pico-sdk and no board matrix. It needs the framework beside it -- which the
# shared workflow always checks out -- and its own vendored freetype and jansson, which arrive
# with the recursive checkout of this repository.
#
# scripts/test.ps1 builds everything, runs the 93 CTest cases, then runs the smoke command. The
# smoke matters more here than anywhere else: crush is the heaviest consumer of light_cli -- 23
# commands covering registration, parsing, dispatch and aliasing, plus the whole module
# load/unload cycle -- and none of that is under CTest.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build and test crush
    uses: lightsource-nz/light_framework_mk3/.github/workflows/project-test.yml@main
    with:
      project: font-crusher
      # crush is what every other project's font rendering runs through, so a build of it is
      # worth keeping off a green run
      artifact_path: font-crusher/build/bin/crush
      artifact_name: crush
